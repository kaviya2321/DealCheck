services:
  - type: web
    name: dealcheck
    runtime: python
    buildCommand: "npm run build --prefix frontend && pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PAYPAL_ENV
        value: sandbox
      - key: FRONTEND_URL
        sync: false
